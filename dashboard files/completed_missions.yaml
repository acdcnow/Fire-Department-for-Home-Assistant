type: markdown
title: 🕓 Mission history (24 h)
content: >
  {% set entity = 'sensor.fire_department_completed_missions' %}

  **Finished missions:** {{ states(entity) }}

  {% if state_attr(entity, 'average_duration') %}**Average duration:** {{
  state_attr(entity, 'average_duration') }}{% endif %}

  {% set missions = state_attr(entity, 'incidents') %}

  {% if missions %}
  <table width="100%">
  <tr><th align="left">Time</th><th align="left">Alert</th><th align="left">Town</th><th align="left">Type</th><th align="left">Duration</th></tr>
  {% for m in missions %}
  <tr>
    <td style="border-left: 6px solid {{ m.color or '#9ca3af' }}; padding-left: 6px">{{ m.time or m.date }}</td>
    <td>{{ m.keyword or '' }}</td>
    <td>{{ m.municipality }}{% if m.district %} ({{ m.district }}){% endif %}</td>
    <td>{{ m.type }}</td>
    <td>{{ m.duration_minutes ~ ' min' if m.duration_minutes else '-' }}</td>
  </tr>
  {% endfor %}
  </table>
  {% else %}<i>No finished missions in the window.</i>{% endif %}
grid_options:
  columns: 18
  rows: auto
