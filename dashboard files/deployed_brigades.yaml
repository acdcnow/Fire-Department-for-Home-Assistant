type: markdown
title: 🚒 Deployed brigades
content: >
  {% set entity = 'sensor.fire_department_deployed_fire_brigades' %}

  **Brigades in action:** {{ states(entity) }}

  {% set missions = state_attr(entity, 'incidents') %}

  {% if missions %}
  <table width="100%">
  <tr><th align="left">Since</th><th align="left">Brigade</th><th align="left">Alert</th><th align="left">Town</th></tr>
  {% for m in missions %}
  <tr>
    <td style="border-left: 6px solid {{ m.color or '#9ca3af' }}; padding-left: 6px">{{ m.time or m.age or m.date }}</td>
    <td>{{ m.brigade or m.municipality }}{% if m.brigade_code %} ({{ m.brigade_code }}){% endif %}</td>
    <td>{{ m.keyword or '' }} {{ m.type }}</td>
    <td>{{ m.municipality }}</td>
  </tr>
  {% endfor %}
  </table>
  {% else %}<i>No brigades deployed right now.</i>{% endif %}
grid_options:
  columns: 18
  rows: auto
