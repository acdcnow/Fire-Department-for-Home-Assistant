type: grid
cards:
  - type: markdown
    title: 🔥 Running missions
    content: >
      {% set entity = 'sensor.fire_department_active_operations' %}

      {% set missions = state_attr(entity, 'incidents') %}

      {% if missions %}
      <table width="100%">
      <tr><th align="left">Since</th><th align="left">Alert</th><th align="left">Town</th><th align="left">Type</th></tr>
      {% for m in missions %}
      <tr>
        <td style="border-left: 6px solid {{ m.color or '#9ca3af' }}; padding-left: 6px">{{ m.time or m.age or m.date }}</td>
        <td>{{ m.keyword or '' }}</td>
        <td>{{ m.municipality }}{% if m.district %} ({{ m.district }}){% endif %}</td>
        <td>{{ m.type }}</td>
      </tr>
      {% endfor %}
      </table>
      {% else %}<i>No running missions right now.</i>{% endif %}
    grid_options:
      columns: 18
      rows: auto
  - type: markdown
    title: 🚒 Deployed brigades
    content: >
      {% set entity = 'sensor.fire_department_deployed_fire_brigades' %}

      **Brigades in action:** {{ states(entity) }}

      {% set missions = state_attr(entity, 'incidents') %}

      {% if missions %}
      <table width="100%">
      <tr><th align="left">Since</th><th align="left">Brigade</th><th align="left">Alert</th></tr>
      {% for m in missions %}
      <tr>
        <td style="border-left: 6px solid {{ m.color or '#9ca3af' }}; padding-left: 6px">{{ m.time or m.age or m.date }}</td>
        <td>{{ m.brigade or m.municipality }}{% if m.brigade_code %} ({{ m.brigade_code }}){% endif %}</td>
        <td>{{ m.keyword or '' }} {{ m.type }}</td>
      </tr>
      {% endfor %}
      </table>
      {% else %}<i>No brigades deployed right now.</i>{% endif %}
    grid_options:
      columns: 18
      rows: auto
  - type: markdown
    title: 🕓 Mission history (24 h)
    content: >
      {% set entity = 'sensor.fire_department_completed_missions' %}

      **Finished missions:** {{ states(entity) }}{% if state_attr(entity, 'average_duration') %} · Ø {{ state_attr(entity, 'average_duration') }}{% endif %}

      {% set missions = state_attr(entity, 'incidents') %}

      {% if missions %}
      <table width="100%">
      <tr><th align="left">Time</th><th align="left">Alert</th><th align="left">Town</th><th align="left">Duration</th></tr>
      {% for m in missions %}
      <tr>
        <td style="border-left: 6px solid {{ m.color or '#9ca3af' }}; padding-left: 6px">{{ m.time or m.date }}</td>
        <td>{{ m.keyword or '' }}</td>
        <td>{{ m.municipality }}{% if m.district %} ({{ m.district }}){% endif %}</td>
        <td>{{ m.duration_minutes ~ ' min' if m.duration_minutes else '-' }}</td>
      </tr>
      {% endfor %}
      </table>
      {% else %}<i>No finished missions in the window.</i>{% endif %}
    grid_options:
      columns: 18
      rows: auto
  - type: markdown
    title: 🧭 At a glance
    content: >
      {% set entity = 'sensor.fire_department_active_operations' %}

      {% set missions = state_attr(entity, 'incidents') %}

      **Missions:** {{ states(entity) }} · **Brigades:** {{
      states('sensor.fire_department_deployed_fire_brigades') }} · **Running since:** {{
      state_attr(entity, 'longest_running').age if state_attr(entity, 'longest_running') else '-' }}

      {% set colors = state_attr(entity, 'color_legend') or {} %}

      {% for name, color in colors.items() %}
      <span style="display:inline-block;background:{{ color }};color:#fff;border-radius:4px;padding:1px 6px;margin-right:4px">{{ name }}</span>
      {% endfor %}
    grid_options:
      columns: 18
      rows: auto
column_span: 2
