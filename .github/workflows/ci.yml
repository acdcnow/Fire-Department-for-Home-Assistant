name: CI

on:
  push:
    branches: [main, HA2026_09_dev]
  pull_request:
    branches: [main, HA2026_09_dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest beautifulsoup4 voluptuous

      - name: Compile all Python sources
        run: python -m compileall -q custom_components

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          failed = False
          for path in sorted(pathlib.Path(".").rglob("*.json")):
              if ".git" in path.parts:
                  continue
              try:
                  json.loads(path.read_text(encoding="utf-8"))
                  print(f"ok      {path}")
              except Exception as err:
                  failed = True
                  print(f"FAILED  {path}: {err}")

          manifest = pathlib.Path("custom_components/fire_department/manifest.json")
          data = json.loads(manifest.read_text(encoding="utf-8"))
          for key in ("domain", "name", "version", "documentation", "issue_tracker", "codeowners"):
              if key not in data:
                  failed = True
                  print(f"FAILED  {manifest}: missing '{key}'")

          sys.exit(1 if failed else 0)
          PY

      - name: Validate dashboard YAML
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import yaml

          failed = False
          for path in sorted(pathlib.Path("dashboard files").rglob("*.yaml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  print(f"ok      {path}")
              except Exception as err:
                  failed = True
                  print(f"FAILED  {path}: {err}")

          sys.exit(1 if failed else 0)
          PY

      - name: Run the test suite when the branch has one
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q
          else
            echo "no tests/ directory on this branch - static checks only"
          fi
